name: Publish

# Publishes to npm and to JSR with OIDC, so there is no token to store,
# rotate, or let expire. npm trusts this workflow through the Trusted
# Publisher settings of the package on npmjs.com, which must name this file
# (npm-publish.yml). JSR trusts this repository through the GitHub link in the
# package settings on jsr.io.
#
# Release flow:
#   1. commit the version bump (package.json, jsr.json, the library_version
#      of skills/base-error/SKILL.md, CHANGELOG.md) to main
#   2. git tag v8.2.0 && git push --tags
#
# Tags only, never a branch push: otherwise every documentation commit on main
# would attempt a publish of a version that is already on the registry. A
# manual run publishes an existing release tag to JSR only, for a tag that
# reached npm but not JSR.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag that npm already has, for example v9.0.0. Publishes it to JSR only."
        required: true
        type: string

permissions:
  # write: the workflow creates the GitHub Release for the tag.
  contents: write
  # Required for OIDC. Without it npm cannot verify the workflow's identity.
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or later. The step does not rely
      # on the npm that the Node.js release bundles.
      - name: Use a publish-capable npm
        run: npm install -g npm@latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # A tag that disagrees with the manifest publishes a version nobody
      # tagged. Fail here rather than on the registry. The skill ships in
      # both packages and names the version that it teaches, so it is a
      # third copy of the version.
      - name: Check the tag against the manifests and the skill
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          JSR="$(node -p "require('./jsr.json').version")"
          SKILL="$(node -p "(require('fs').readFileSync('skills/base-error/SKILL.md', 'utf8').match(/^  library_version: \"([^\"]+)\"$/m) ?? [])[1] ?? ''")"
          echo "tag=$TAG package.json=$PKG jsr.json=$JSR skill=$SKILL"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$JSR" ] || [ "$TAG" != "$SKILL" ]; then
            echo "::error::tag $TAG does not match package.json ($PKG) / jsr.json ($JSR) / library_version of skills/base-error/SKILL.md ($SKILL)"
            exit 1
          fi

      # `prepublishOnly` runs `pnpm build`, which is typecheck + tests + lint +
      # tsup. A tag push does not trigger the Tests workflow, so this is the
      # gate that stands between a bad commit and the registry.
      - name: Publish
        run: npm publish

      # The tag's CHANGELOG.md section becomes the notes, so the changelog
      # stays the single owner of the release notes. Runs after the npm
      # publish: a notes failure must not block the registry, only this step.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  # Waits for the npm job, because its prepublishOnly is the gate that tests
  # the tag. A failed JSR publish then re-runs alone with "Re-run failed jobs".
  # A manual run skips the npm job and publishes the tag that it names.
  jsr:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Check the tag against jsr.json
        run: |
          VERSION="${TAG#v}"
          JSR="$(node -p "require('./jsr.json').version")"
          echo "tag=$VERSION jsr.json=$JSR"
          if [ "$VERSION" != "$JSR" ]; then
            echo "::error::tag $VERSION does not match jsr.json ($JSR)"
            exit 1
          fi

      - name: Publish to JSR
        run: npx --yes jsr publish
