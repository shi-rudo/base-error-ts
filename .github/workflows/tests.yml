name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Vitest 4 requires Node ^20 || ^22 || >=24 (Node 18 is unsupported and EOL).
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      # The example service imports the library like a consumer; a stale
      # import there must fail here, because tsx runs it without a check.
      - name: Type check the voucher-service example
        run: pnpm typecheck:examples

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test:run

      - name: Verify coverage thresholds
        if: matrix.node-version == '20.x'
        run: pnpm test:coverage

      - name: Build package
        run: pnpm build

  # The vitest suite cannot run on Bun or Deno, so each gets a smoke job: the
  # built package runs scripts/runtime-smoke.mjs, which carries the
  # load-bearing behaviors (totality, redaction, fromJSON, the pipeline).
  smoke-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build package
        run: pnpm exec tsup
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Run the runtime smoke on Bun
        run: bun scripts/runtime-smoke.mjs

  smoke-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build package
        run: pnpm exec tsup
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run the runtime smoke on Deno
        run: deno run scripts/runtime-smoke.mjs

  # Runs the runtime-pure suite on the real Workers runtime (workerd via
  # miniflare) to catch edge-incompatibilities Node cannot (accidental globals,
  # captureStackTrace assumptions, Node-only APIs).
  test-workerd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run tests on workerd
        run: pnpm test:workers
