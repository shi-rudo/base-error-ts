name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The supported Node.js lines: the active LTS and the current release.
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      # The example service imports the library like a consumer; a stale
      # import there must fail here, because tsx runs it without a check.
      - name: Type check the voucher-service example
        run: pnpm typecheck:examples

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test:run

      - name: Verify coverage thresholds
        if: matrix.node-version == '24.x'
        run: pnpm test:coverage

      - name: Build package
        run: pnpm build

  # The vitest suite cannot run on Bun or Deno, so each gets a smoke job: the
  # built package runs scripts/runtime-smoke.mjs, which carries the
  # load-bearing behaviors (totality, redaction, fromJSON, the pipeline).
  smoke-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build package
        run: pnpm exec tsup
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Run the runtime smoke on Bun
        run: bun scripts/runtime-smoke.mjs

  smoke-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build package
        run: pnpm exec tsup
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run the runtime smoke on Deno
        run: deno run scripts/runtime-smoke.mjs

  # VitePress fails the build on a dead internal link, so the build is the
  # link check of the docs site.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build the docs site
        run: pnpm docs:build
      - name: Check that each guide page was generated
        run: |
          for page in docs/guide/*.md; do
            html="docs/.vitepress/dist/guide/$(basename "$page" .md).html"
            test -s "$html" || { echo "missing page: $html"; exit 1; }
          done

  # Runs the runtime-pure suite on the real Workers runtime (workerd via
  # miniflare) to catch edge-incompatibilities Node cannot (accidental globals,
  # captureStackTrace assumptions, Node-only APIs).
  test-workerd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run tests on workerd
        run: pnpm test:workers

  # Installs the packed tarball into fresh fixtures outside the repository and
  # compiles a consumer with TypeScript 5.0.4, the latest 6.x and the latest
  # release, in each supported module-resolution mode.
  packed-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build package
        run: pnpm exec tsup
      - name: Check the packed package as a consumer
        run: node scripts/verify-packed-consumer.mjs
